[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-sentry"
version = "0.1.0"
description = "Surface implementation-changing ambiguities in specs."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
spec-sentry = "spec_sentry.__main__:main"

[tool.setuptools.packages.find]
include = ["spec_sentry*"]

[tool.setuptools.package-data]
"*" = ["web/*.css", "web/*.js", "assets/*.css", "assets/*.js", "*.css", "*.js", "*.json"]
